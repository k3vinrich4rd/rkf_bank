      - url: "{{ _.base_url }}/auth/login"
        name: "Login · ADMIN (só perfil equipe ou MySQL)"
        meta:
          id: "req_rkfbank_01_02"
          created: 1792777656439
          modified: 1792777656439
          isPrivate: false
          description: "O ADMIN não nasce por rota: a API cria na subida se `ADMIN_CPF` e `ADMIN_SENHA` estiverem no ambiente. No perfil **visitante** não existe ADMIN (de propósito): este login dá `401`."
          sortKey: 2
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "cpf": "{{ _.admin_cpf }}",
              "senha": "{{ _.admin_senha }}"

type: "collection.insomnia.rest/5.0"
schema_version: "5.1"
name: "RKF Bank API"
meta:
  id: "wrk_rkfbank"
  created: 1792955315937
  modified: 1792955315937
  description: "Coleção gerada por scripts/gerar-colecao-insomnia.mjs. Guia: backend/README_TESTES_E2E.md."
collection:
  - name: "00 · Comece aqui"
    meta:
      id: "fld_rkfbank_00"
      created: 1792955315937
      modified: 1792955315937
      sortKey: 0
      description: |-
        💡 Antes de testar qualquer coisa, confira se a API está ligada. É como ver se a luz da maquininha acendeu.

        Escolha o **ambiente** no canto superior esquerdo (Visitante ou Equipe) e mande a primeira requisição. `{"status":"UP"}` = a API está no ar. Sem resposta? Ela não subiu: veja o guia `backend/README_TESTES_E2E.md`.
    children:
      - url: "{{ _.base_url }}/actuator/health"
        name: "Saúde da API"
        meta:
          id: "req_rkfbank_00_00"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: |-
            💡 **Em palavras simples:** A primeira pergunta: "você está aí?". Resposta `UP` = a API está ligada e pronta. Sem resposta, nada mais vai funcionar: suba a API antes.

            Pública. Usada pelo Docker e pelo deploy para saber se a API respondeu.
          sortKey: 0
        method: "GET"
        authentication:
          type: "none"
        scripts:
          afterResponse: |-
            insomnia.test("status 200", () => insomnia.expect(insomnia.response.code).to.equal(200));
            insomnia.test("UP", () => insomnia.expect(insomnia.response.json().status).to.equal("UP"));
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/termos"
        name: "Versão dos termos (pública)"
        meta:
          id: "req_rkfbank_00_01"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: |-
            💡 **Em palavras simples:** Mostra qual versão dos Termos de Uso está valendo. O cadastro precisa dizer que a pessoa aceitou esses termos, igual ao "li e aceito" de qualquer app.

            Versão vigente dos Termos de Uso e da Política de Privacidade (contrato 3.1). A tela de cadastro mostra estes textos e manda a versão aceita em `termosVersao`.
          sortKey: 1
        method: "GET"
        authentication:
          type: "none"
        scripts:
          afterResponse: |-
            insomnia.test("status 200", () => insomnia.expect(insomnia.response.code).to.equal(200));
            if (insomnia.response.code === 200) insomnia.environment.set("termos_versao", insomnia.response.json().versao);
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
  - name: "01 · Login (guarda o token sozinho)"
    meta:
      id: "fld_rkfbank_01"
      created: 1792955315937
      modified: 1792955315937
      sortKey: 1
      description: |-
        💡 Entrar no banco, como no app: CPF e senha. A API devolve um "crachá" (o token) que as próximas requisições mostram para provar quem você é. O Insomnia guarda esse crachá sozinho.

        Cada login roda um script que salva no ambiente o token de acesso (`token_origem`, `token_destino`...) e o de renovação (`refresh_origem`...). As outras pastas já usam essas variáveis na aba **Auth → Bearer**. O token de acesso vence (15 min no MySQL, 60 min no H2): deu `401 Token inválido ou expirado`? Mande o login de novo, ou renove pela pasta **09 · Sessão**.
    children:
      - url: "{{ _.base_url }}/auth/login"
        name: "Login · cliente ORIGEM (Ana / Fellipe)"
        meta:
          id: "req_rkfbank_01_00"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** Entra como o cliente que vai MANDAR dinheiro. Na resposta, o `token` é o crachá de acesso; o Insomnia guarda ele em `token_origem` e as próximas requisições usam sozinhas."
          sortKey: 0
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "cpf": "{{ _.cpf_origem }}",
              "senha": "{{ _.senha_clientes }}"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
        authentication:
          type: "none"
        scripts:
          afterResponse: |-
            insomnia.test("status 200", () => insomnia.expect(insomnia.response.code).to.equal(200));
            if (insomnia.response.code === 200) {
              const login = insomnia.response.json();
              insomnia.environment.set("token_origem", login.token);
              insomnia.environment.set("refresh_origem", login.refreshToken);
              insomnia.environment.set("cliente_origem_id", login.clienteId ?? "");
              console.log("perfil:", login.perfil, "· token vale", login.expiraEmSegundos, "s · renovação vale", login.refreshExpiraEmSegundos, "s");
            }
            if (insomnia.response.code === 200) {
              const payload = insomnia.response.json().token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
              insomnia.environment.set("usuario_origem_id", JSON.parse(atob(payload)).sub);
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/auth/login"
        name: "Login · cliente DESTINO (Bruno / Renan)"
        meta:
          id: "req_rkfbank_01_01"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** Entra como o cliente que vai RECEBER dinheiro. Ter dois clientes logados permite provar que um não enxerga a conta do outro."
          sortKey: 1
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "cpf": "{{ _.cpf_destino }}",
              "senha": "{{ _.senha_clientes }}"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
        authentication:
          type: "none"
        scripts:
          afterResponse: |-
            insomnia.test("status 200", () => insomnia.expect(insomnia.response.code).to.equal(200));
            if (insomnia.response.code === 200) {
              const login = insomnia.response.json();
              insomnia.environment.set("token_destino", login.token);
              insomnia.environment.set("refresh_destino", login.refreshToken);
              insomnia.environment.set("cliente_destino_id", login.clienteId ?? "");
              console.log("perfil:", login.perfil, "· token vale", login.expiraEmSegundos, "s · renovação vale", login.refreshExpiraEmSegundos, "s");
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
  - name: "02 · Fluxo E2E: cliente novo, do cadastro ao extrato"
    meta:
      id: "fld_rkfbank_02"
      created: 1792955315937
      modified: 1792955315937
      sortKey: 2
      description: |-
        💡 A vida inteira de um cliente novo, na ordem em que acontece de verdade: criar o cadastro, entrar, abrir duas contas, colocar dinheiro, tirar, transferir e conferir o extrato centavo a centavo.

        O roteiro E2E principal, na ordem: cadastro (CPF, CEP e telefone com máscara, endereço pelo ViaCEP) → login → contas ORIGEM e DESTINO → depósito, saque e transferência → extratos. O cadastro sorteia CPF e e-mail novos a cada envio, então pode repetir à vontade. Precisa de internet: o endereço vem do ViaCEP.
    children:
      - url: "{{ _.base_url }}/clientes"
        name: "Cadastrar cliente (público)"
        meta:
          id: "req_rkfbank_02_00"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: |-
            💡 **Em palavras simples:** Cria um cliente do zero, sem precisar estar logado (como abrir conta pelo app). O CPF é sorteado a cada envio, então dá para repetir. Repare: a resposta devolve o CPF escondido (`***.982.247-**`) e o endereço que a API buscou sozinha pelo CEP.

            `aceiteTermos: true` é obrigatório (LGPD, contrato 3.1). Manda CPF, CEP e telefone **com máscara**, como a pessoa digita: a API higieniza (fica só com os dígitos), valida o CPF pelos dígitos verificadores e busca o endereço no **ViaCEP** (Osasco/SP). `201` com o cliente. A resposta traz o CPF **mascarado** e a versão dos termos aceita. O cadastro **não** devolve token: faça o login.
          sortKey: 0
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "nomeCompleto": "Cliente Novo do Insomnia",
              "cpf": "{{ _.novo_cpf_mascara }}",
              "email": "{{ _.novo_email }}",
              "telefone": "(11) 99999-8888",
              "cep": "06020-010",
              "numero": "123",
              "complemento": "Apto 45",
              "senha": "{{ _.novo_senha }}",
              "aceiteTermos": true
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
        authentication:
          type: "none"
        scripts:
          preRequest: |-
            const n = Array.from({ length: 9 }, () => Math.floor(Math.random() * 10));
            if (n.every((d) => d === n[0])) n[0] = (n[0] + 1) % 10;
            for (const tamanho of [9, 10]) {
              const soma = n.slice(0, tamanho).reduce((acc, d, i) => acc + d * (tamanho + 1 - i), 0);
              const resto = (soma * 10) % 11;
              n.push(resto === 10 ? 0 : resto);
            }
            const sufixo = Date.now().toString(36);
            insomnia.environment.set("novo_cpf", n.join(""));
            const d = n.join("");
            insomnia.environment.set("novo_cpf_mascara", d.slice(0, 3) + "." + d.slice(3, 6) + "." + d.slice(6, 9) + "-" + d.slice(9));
            insomnia.environment.set("novo_email", "cliente.novo." + sufixo + "@exemplo.test");
            insomnia.environment.set("novo_senha", "senha-do-novo-" + sufixo);
            console.log("CPF sorteado:", n.join(""));
          afterResponse: |-
            insomnia.test("status 201", () => insomnia.expect(insomnia.response.code).to.equal(201));
            if (insomnia.response.code === 201) insomnia.environment.set("novo_cliente_id", insomnia.response.json().id);
            const c = insomnia.response.code === 201 ? insomnia.response.json() : null;
            insomnia.test("ViaCEP preencheu a cidade", () => insomnia.expect(c.endereco.cidade).to.equal("Osasco"));
            insomnia.test("CEP higienizado", () => insomnia.expect(c.endereco.cep.replace(/\D/g, "")).to.equal("06020010"));
            insomnia.test("CPF mascarado na resposta", () => insomnia.expect(c.cpf).to.match(/^\*\*\*\.\d{3}\.\d{3}-\*\*$/));
            insomnia.test("aceite gravado", () => insomnia.expect(c.termosAceitosEm).to.be.ok);
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/auth/login"
        name: "Login · cliente novo"
        meta:
          id: "req_rkfbank_02_01"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** O cadastro não faz login automático: agora o cliente novo entra com o CPF e a senha que acabou de criar."
          sortKey: 1
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "cpf": "{{ _.novo_cpf }}",
              "senha": "{{ _.novo_senha }}"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
        authentication:
          type: "none"
        scripts:
          afterResponse: |-
            insomnia.test("status 200", () => insomnia.expect(insomnia.response.code).to.equal(200));
            if (insomnia.response.code === 200) {
              const login = insomnia.response.json();
              insomnia.environment.set("token_novo", login.token);
              insomnia.environment.set("refresh_novo", login.refreshToken);
              console.log("perfil:", login.perfil, "· token vale", login.expiraEmSegundos, "s · renovação vale", login.refreshExpiraEmSegundos, "s");
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/contas"
        name: "Abrir conta ORIGEM: corrente"
        meta:
          id: "req_rkfbank_02_02"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: |-
            💡 **Em palavras simples:** Abre uma conta corrente. Você só diz o tipo: o banco sabe de quem é pelo token e gera o número da conta sozinho. Status `201` = criado.

            Corpo só com `tipoConta`: o dono vem do **token**, a agência é `0001` e o número (com dígito verificador) é gerado pelo banco.
          sortKey: 2
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "tipoConta": "CORRENTE"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
        authentication:
          type: "bearer"
          token: "{{ _.token_novo }}"
          prefix: ""
        scripts:
          afterResponse: |-
            insomnia.test("status 201", () => insomnia.expect(insomnia.response.code).to.equal(201));
            if (insomnia.response.code === 201) insomnia.environment.set("conta_nova_id", insomnia.response.json().id);
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/contas"
        name: "Abrir conta DESTINO: poupança"
        meta:
          id: "req_rkfbank_02_03"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: |-
            💡 **Em palavras simples:** Abre uma segunda conta, poupança, para o mesmo cliente. Ela vai receber a transferência mais adiante.

            Um cliente pode ter mais de uma conta. Esta recebe a transferência logo abaixo.
          sortKey: 3
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "tipoConta": "POUPANCA"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
        authentication:
          type: "bearer"
          token: "{{ _.token_novo }}"
          prefix: ""
        scripts:
          afterResponse: |-
            insomnia.test("status 201", () => insomnia.expect(insomnia.response.code).to.equal(201));
            if (insomnia.response.code === 201) insomnia.environment.set("conta_nova_destino_id", insomnia.response.json().id);
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/contas"
        name: "Minhas contas (as duas com saldo 0,00)"
        meta:
          id: "req_rkfbank_02_04"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** Lista as contas do cliente logado. As duas acabaram de nascer, então os saldos são zero."
          sortKey: 4
        method: "GET"
        authentication:
          type: "bearer"
          token: "{{ _.token_novo }}"
          prefix: ""
        scripts:
          afterResponse: |-
            insomnia.test("status 200", () => insomnia.expect(insomnia.response.code).to.equal(200));
            insomnia.test("duas contas", () => insomnia.expect(insomnia.response.json().length).to.equal(2));
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/contas/{{ _.conta_nova_id }}/depositos"
        name: "Depositar R$ 150,00 na ORIGEM"
        meta:
          id: "req_rkfbank_02_05"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: |-
            💡 **Em palavras simples:** Coloca dinheiro na conta. A resposta `204` vem vazia de propósito: quer dizer "deu certo, não tenho nada para mostrar". O saldo novo aparece em "Minhas contas".

            `204` sem corpo. O header `Idempotency-Key` (aba Headers) gera um UUID novo a cada envio.
          sortKey: 5
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "valor": 150,
              "descricao": "Deposito pelo Insomnia"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
          - name: "Idempotency-Key"
            value: "{% uuid 'v4' %}"
        authentication:
          type: "bearer"
          token: "{{ _.token_novo }}"
          prefix: ""
        scripts:
          afterResponse: "insomnia.test(\"status 204\", () => insomnia.expect(insomnia.response.code).to.equal(204));"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/contas/{{ _.conta_nova_id }}/saques"
        name: "Sacar R$ 50,00 da ORIGEM"
        meta:
          id: "req_rkfbank_02_06"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** Tira dinheiro da conta. Também responde `204`, vazio. Sobram R$ 100,00."
          sortKey: 6
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "valor": 50,
              "descricao": "Saque pelo Insomnia"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
          - name: "Idempotency-Key"
            value: "{% uuid 'v4' %}"
        authentication:
          type: "bearer"
          token: "{{ _.token_novo }}"
          prefix: ""
        scripts:
          afterResponse: "insomnia.test(\"status 204\", () => insomnia.expect(insomnia.response.code).to.equal(204));"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/transferencias"
        name: "Transferir R$ 25,00 ORIGEM → DESTINO"
        meta:
          id: "req_rkfbank_02_07"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: |-
            💡 **Em palavras simples:** Move dinheiro de uma conta para a outra. O banco garante que o débito e o crédito acontecem juntos: nunca sai de um lado sem chegar no outro.

            Débito e crédito na mesma transação: ou os dois acontecem, ou nenhum.
          sortKey: 7
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "contaOrigemId": "{{ _.conta_nova_id }}",
              "contaDestinoId": "{{ _.conta_nova_destino_id }}",
              "valor": 25.00,
              "descricao": "Transferencia pelo Insomnia"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
          - name: "Idempotency-Key"
            value: "{% uuid 'v4' %}"
        authentication:
          type: "bearer"
          token: "{{ _.token_novo }}"
          prefix: ""
        scripts:
          afterResponse: "insomnia.test(\"status 204\", () => insomnia.expect(insomnia.response.code).to.equal(204));"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/contas"
        name: "Saldos: ORIGEM 75,00 · DESTINO 25,00"
        meta:
          id: "req_rkfbank_02_08"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** A conferência: 150 − 50 − 25 = 75 na ORIGEM e 25 na DESTINO. Se os números baterem, o dinheiro andou certinho."
          sortKey: 8
        method: "GET"
        authentication:
          type: "bearer"
          token: "{{ _.token_novo }}"
          prefix: ""
        scripts:
          afterResponse: |-
            insomnia.test("status 200", () => insomnia.expect(insomnia.response.code).to.equal(200));
            const contas = insomnia.response.code === 200 ? insomnia.response.json() : [];
            const saldo = (id) => Number(contas.find((c) => c.id === insomnia.environment.get(id))?.saldo);
            insomnia.test("origem 75", () => insomnia.expect(saldo("conta_nova_id")).to.equal(75));
            insomnia.test("destino 25", () => insomnia.expect(saldo("conta_nova_destino_id")).to.equal(25));
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/contas/{{ _.conta_nova_id }}"
        name: "Ver só a conta ORIGEM"
        meta:
          id: "req_rkfbank_02_09"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: |-
            💡 **Em palavras simples:** Busca uma conta só, pelo id. É o que a tela usa para atualizar o saldo sem pedir a lista inteira.

            `GET /contas/{contaId}` (contrato 3.1): uma conta só, para atualizar o saldo sem buscar a lista inteira.
          sortKey: 9
        method: "GET"
        authentication:
          type: "bearer"
          token: "{{ _.token_novo }}"
          prefix: ""
        scripts:
          afterResponse: |-
            insomnia.test("status 200", () => insomnia.expect(insomnia.response.code).to.equal(200));
            insomnia.test("saldo 75", () => insomnia.expect(Number(insomnia.response.json().saldo)).to.equal(75));
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/contas/{{ _.conta_nova_id }}/lancamentos"
        name: "Extrato da ORIGEM (3 lançamentos)"
        meta:
          id: "req_rkfbank_02_10"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: |-
            💡 **Em palavras simples:** O extrato: cada movimento da conta, do mais novo para o mais antigo. Aqui são três (depósito, saque e transferência).

            Do mais recente para o mais antigo. `valor` sempre positivo: se `contaDestinoId` é esta conta, é entrada.
          sortKey: 10
        method: "GET"
        authentication:
          type: "bearer"
          token: "{{ _.token_novo }}"
          prefix: ""
        scripts:
          afterResponse: |-
            insomnia.test("status 200", () => insomnia.expect(insomnia.response.code).to.equal(200));
            insomnia.test("transferência, saque e depósito", () => insomnia.expect(insomnia.response.json().length).to.equal(3));
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false

  - name: "08 · CORS (navegador chamando a API direto)"
    meta:
      id: "fld_rkfbank_08"
      created: 1792955315937
      modified: 1792955315937
      sortKey: 8
      description: |-
        💡 Uma regra do navegador (CORS): só o site do RKF Bank pode chamar a API de dentro de uma página. Um site estranho é barrado.

        O site de hoje passa pelo proxy do Next e não usa CORS. Isto vale para um navegador chamando a API direto. As origens permitidas vêm de `CORS_ORIGENS` (padrão `http://localhost:3000`).
    children:
      - url: "{{ _.base_url }}/transferencias"
        name: "Preflight de origem permitida → 200"
        meta:
          id: "req_rkfbank_08_00"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** Antes de chamar a API, o navegador pergunta \"posso?\" (o preflight). Vindo do site do RKF Bank (`localhost:3000`), a resposta é sim."
          sortKey: 0
        method: "OPTIONS"
        headers:
          - name: "Origin"
            value: "http://localhost:3000"
          - name: "Access-Control-Request-Method"
            value: "POST"
          - name: "Access-Control-Request-Headers"
            value: "authorization,content-type,idempotency-key"
        authentication:
          type: "none"
        scripts:
          afterResponse: |-
            insomnia.test("status 200", () => insomnia.expect(insomnia.response.code).to.equal(200));
            insomnia.test("Allow-Origin", () => insomnia.expect(insomnia.response.headers.get("Access-Control-Allow-Origin")).to.equal("http://localhost:3000"));
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/transferencias"
        name: "Preflight de origem estranha → 403"
        meta:
          id: "req_rkfbank_08_01"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** A mesma pergunta vinda de um site desconhecido: não (`403`). Assim um site malicioso não usa a sua sessão para mexer na sua conta."
          sortKey: 1
        method: "OPTIONS"
        headers:
          - name: "Origin"
            value: "https://site-estranho.example"
          - name: "Access-Control-Request-Method"
            value: "POST"
        authentication:
          type: "none"
        scripts:
          afterResponse: "insomnia.test(\"status 403\", () => insomnia.expect(insomnia.response.code).to.equal(403));"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
  - name: "09 · Sessão: renovar e sair (refresh token)"
    meta:
      id: "fld_rkfbank_09"
      created: 1792955315937
      modified: 1792955315937
      sortKey: 9
      description: |-
        💡 Ficar logado sem digitar a senha de novo, e sair de verdade. O crachá curto (token) é renovado com um segundo crachá, mais longo (refresh token).

        Contrato 3.1. O login devolve, além do token de acesso (15 min), um **token de renovação** (7 dias) que troca o par sem pedir a senha. Ele é de **uso único**: usar de novo um já trocado é sinal de roubo e derruba todas as sessões da pessoa. Mande na ordem; usa o cliente DESTINO, e no fim ele entra de novo para as outras pastas continuarem.
    children:
      - url: "{{ _.base_url }}/auth/login"
        name: "Login · cliente DESTINO"
        meta:
          id: "req_rkfbank_09_00"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** Entra de novo para ter um par novinho de crachás: o de acesso (curto) e o de renovação (7 dias)."
          sortKey: 0
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "cpf": "{{ _.cpf_destino }}",
              "senha": "{{ _.senha_clientes }}"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
        authentication:
          type: "none"
        scripts:
          afterResponse: |-
            insomnia.test("status 200", () => insomnia.expect(insomnia.response.code).to.equal(200));
            if (insomnia.response.code === 200) {
              const login = insomnia.response.json();
              insomnia.environment.set("token_destino", login.token);
              insomnia.environment.set("refresh_destino", login.refreshToken);
              console.log("perfil:", login.perfil, "· token vale", login.expiraEmSegundos, "s · renovação vale", login.refreshExpiraEmSegundos, "s");
            }
            if (insomnia.response.code === 200) insomnia.environment.set("refresh_usado", insomnia.response.json().refreshToken);
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/auth/refresh"
        name: "Renovar: troca o par"
        meta:
          id: "req_rkfbank_09_01"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: |-
            💡 **Em palavras simples:** Troca o crachá de renovação por um par novo, sem digitar a senha. É assim que o app te mantém logado. O de renovação antigo deixa de valer.

            Público: o token de renovação vai no corpo (o de acesso pode já ter vencido). Mesmo formato do login.
          sortKey: 1
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "refreshToken": "{{ _.refresh_destino }}"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
        authentication:
          type: "none"
        scripts:
          afterResponse: |-
            insomnia.test("status 200", () => insomnia.expect(insomnia.response.code).to.equal(200));
            if (insomnia.response.code === 200) {
              const login = insomnia.response.json();
              insomnia.environment.set("token_destino", login.token);
              insomnia.environment.set("refresh_destino", login.refreshToken);
              console.log("perfil:", login.perfil, "· token vale", login.expiraEmSegundos, "s · renovação vale", login.refreshExpiraEmSegundos, "s");
            }
            insomnia.test("token de renovação novo", () => insomnia.expect(insomnia.response.json().refreshToken).to.not.equal(insomnia.environment.get("refresh_usado")));
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/contas"
        name: "O token novo funciona"
        meta:
          id: "req_rkfbank_09_02"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** O crachá novo abre as contas normalmente."
          sortKey: 2
        method: "GET"
        authentication:
          type: "bearer"
          token: "{{ _.token_destino }}"
          prefix: ""
        scripts:
          afterResponse: "insomnia.test(\"status 200\", () => insomnia.expect(insomnia.response.code).to.equal(200));"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/auth/refresh"
        name: "Reusar o token já trocado → 401"
        meta:
          id: "req_rkfbank_09_03"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: |-
            💡 **Em palavras simples:** Usar de novo um crachá de renovação que já foi trocado é sinal de roubo: o banco recusa E derruba todas as sessões da pessoa.

            Reuso = alguém copiou o token. A API derruba **todas** as renovações da pessoa, inclusive a legítima.
          sortKey: 3
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "refreshToken": "{{ _.refresh_usado }}"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
        authentication:
          type: "none"
        scripts:
          afterResponse: |-
            insomnia.test("status 401", () => insomnia.expect(insomnia.response.code).to.equal(401));
            insomnia.test("codigo SESSAO_EXPIRADA", () => insomnia.expect(insomnia.response.json().codigo).to.equal("SESSAO_EXPIRADA"));
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/auth/refresh"
        name: "Depois do reuso, a renovação legítima também caiu → 401"
        meta:
          id: "req_rkfbank_09_04"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** Prova do passo anterior: até o crachá novo, que era legítimo, foi derrubado. Quem roubou fica sem acesso; o dono só precisa entrar de novo."
          sortKey: 4
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "refreshToken": "{{ _.refresh_destino }}"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
        authentication:
          type: "none"
        scripts:
          afterResponse: |-
            insomnia.test("status 401", () => insomnia.expect(insomnia.response.code).to.equal(401));
            insomnia.test("codigo SESSAO_EXPIRADA", () => insomnia.expect(insomnia.response.json().codigo).to.equal("SESSAO_EXPIRADA"));
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/auth/login"
        name: "Login · cliente DESTINO (de novo)"
        meta:
          id: "req_rkfbank_09_05"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** Entra de novo depois da derrubada."
          sortKey: 5
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "cpf": "{{ _.cpf_destino }}",
              "senha": "{{ _.senha_clientes }}"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
        authentication:
          type: "none"
        scripts:
          afterResponse: |-
            insomnia.test("status 200", () => insomnia.expect(insomnia.response.code).to.equal(200));
            if (insomnia.response.code === 200) {
              const login = insomnia.response.json();
              insomnia.environment.set("token_destino", login.token);
              insomnia.environment.set("refresh_destino", login.refreshToken);
              console.log("perfil:", login.perfil, "· token vale", login.expiraEmSegundos, "s · renovação vale", login.refreshExpiraEmSegundos, "s");
            }
            if (insomnia.response.code === 200) insomnia.environment.set("refresh_usado", insomnia.response.json().refreshToken);
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/auth/logout"
        name: "Sair (logout)"
        meta:
          id: "req_rkfbank_09_06"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: |-
            💡 **Em palavras simples:** Sair de verdade: o crachá de renovação é cancelado no banco, não só apagado do aparelho.

            Revoga o token de renovação. O de acesso continua valendo até vencer (no máximo 15 min): o front o apaga.
          sortKey: 6
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "refreshToken": "{{ _.refresh_usado }}"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
        authentication:
          type: "none"
        scripts:
          afterResponse: "insomnia.test(\"status 204\", () => insomnia.expect(insomnia.response.code).to.equal(204));"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/auth/refresh"
        name: "Renovar depois de sair → 401"
        meta:
          id: "req_rkfbank_09_07"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** Depois de sair, o crachá de renovação não serve mais para nada."
          sortKey: 7
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "refreshToken": "{{ _.refresh_usado }}"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
        authentication:
          type: "none"
        scripts:
          afterResponse: |-
            insomnia.test("status 401", () => insomnia.expect(insomnia.response.code).to.equal(401));
            insomnia.test("codigo SESSAO_EXPIRADA", () => insomnia.expect(insomnia.response.json().codigo).to.equal("SESSAO_EXPIRADA"));
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/auth/logout"
        name: "Sair com token desconhecido → 204"
        meta:
          id: "req_rkfbank_09_08"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: |-
            💡 **Em palavras simples:** Sair com um crachá que o banco não conhece também responde `204`: a API não revela se o crachá existia.

            Sair nunca falha (nem revela se o token existia).
          sortKey: 8
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "refreshToken": "token-que-nunca-existiu"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
        authentication:
          type: "none"
        scripts:
          afterResponse: "insomnia.test(\"status 204\", () => insomnia.expect(insomnia.response.code).to.equal(204));"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/auth/refresh"
        name: "Renovar sem o token → 400"
        meta:
          id: "req_rkfbank_09_09"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** Pedir renovação sem mandar o crachá: `400`."
          sortKey: 9
        method: "POST"
        body:
          mimeType: "application/json"
          text: "{}"
        headers:
          - name: "Content-Type"
            value: "application/json"
        authentication:
          type: "none"
        scripts:
          afterResponse: "insomnia.test(\"status 400\", () => insomnia.expect(insomnia.response.code).to.equal(400));"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/auth/login"
        name: "Login · cliente DESTINO (para as outras pastas)"
        meta:
          id: "req_rkfbank_09_10"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** Deixa o Bruno logado no fim, para você poder mandar as outras pastas de novo sem refazer o login."
          sortKey: 10
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "cpf": "{{ _.cpf_destino }}",
              "senha": "{{ _.senha_clientes }}"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
        authentication:
          type: "none"
        scripts:
          afterResponse: |-
            insomnia.test("status 200", () => insomnia.expect(insomnia.response.code).to.equal(200));
            if (insomnia.response.code === 200) {
              const login = insomnia.response.json();
              insomnia.environment.set("token_destino", login.token);
              insomnia.environment.set("refresh_destino", login.refreshToken);
              insomnia.environment.set("cliente_destino_id", login.clienteId ?? "");
              console.log("perfil:", login.perfil, "· token vale", login.expiraEmSegundos, "s · renovação vale", login.refreshExpiraEmSegundos, "s");
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true

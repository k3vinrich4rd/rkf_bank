              "aceiteTermos": false
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
        authentication:
          type: "none"
        scripts:
          preRequest: |-
            const n = Array.from({ length: 9 }, () => Math.floor(Math.random() * 10));
            if (n.every((d) => d === n[0])) n[0] = (n[0] + 1) % 10;
            for (const tamanho of [9, 10]) {
              const soma = n.slice(0, tamanho).reduce((acc, d, i) => acc + d * (tamanho + 1 - i), 0);
              const resto = (soma * 10) % 11;
              n.push(resto === 10 ? 0 : resto);
            }
            insomnia.environment.set("cpf_extra", n.join(""));
          afterResponse: |-
            insomnia.test("status 400", () => insomnia.expect(insomnia.response.code).to.equal(400));
            insomnia.test("codigo CAMPOS_INVALIDOS", () => insomnia.expect(insomnia.response.json().codigo).to.equal("CAMPOS_INVALIDOS"));
            insomnia.test("campo aceiteTermos", () => insomnia.expect(insomnia.response.json().campos[0].campo).to.equal("aceiteTermos"));

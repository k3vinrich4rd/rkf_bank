  - name: "09 · Sessão: renovar e sair (refresh token)"
    meta:
      id: "fld_rkfbank_09"
      created: 1792777656439
      modified: 1792777656439
      sortKey: 9
      description: "Contrato 3.1. O login devolve, além do token de acesso (15 min), um **token de renovação** (7 dias) que troca o par sem pedir a senha. Ele é de **uso único**: usar de novo um já trocado é sinal de roubo e derruba todas as sessões da pessoa. Mande na ordem; usa o cliente DESTINO, e no fim ele entra de novo para as outras pastas continuarem."
    children:
      - url: "{{ _.base_url }}/auth/login"
        name: "Login · cliente DESTINO"
        meta:
          id: "req_rkfbank_09_00"
          created: 1792777656439
          modified: 1792777656439
          isPrivate: false
          description: ""
          sortKey: 0
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "cpf": "{{ _.cpf_destino }}",
              "senha": "{{ _.senha_clientes }}"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
        authentication:
          type: "none"
        scripts:
          afterResponse: |-
            insomnia.test("status 200", () => insomnia.expect(insomnia.response.code).to.equal(200));
            if (insomnia.response.code === 200) {
              const login = insomnia.response.json();
              insomnia.environment.set("token_destino", login.token);
              insomnia.environment.set("refresh_destino", login.refreshToken);
              console.log("perfil:", login.perfil, "· token vale", login.expiraEmSegundos, "s · renovação vale", login.refreshExpiraEmSegundos, "s");
            }
            if (insomnia.response.code === 200) insomnia.environment.set("refresh_usado", insomnia.response.json().refreshToken);
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/auth/refresh"
        name: "Renovar: troca o par"
        meta:
          id: "req_rkfbank_09_01"
          created: 1792777656439
          modified: 1792777656439
          isPrivate: false
          description: "Público: o token de renovação vai no corpo (o de acesso pode já ter vencido). Mesmo formato do login."
          sortKey: 1
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "refreshToken": "{{ _.refresh_destino }}"
            }

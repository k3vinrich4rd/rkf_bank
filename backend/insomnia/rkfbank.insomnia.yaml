  - name: "04 · Idempotência (o mesmo pedido não movimenta duas vezes)"
    meta:
      id: "fld_rkfbank_04"
      created: 1792955315937
      modified: 1792955315937
      sortKey: 4
      description: |-
        💡 Proteção contra o "cliquei duas vezes": se a internet cair e o app mandar o mesmo depósito de novo, o dinheiro não pode entrar duas vezes.

        Mande na ordem. A 1ª sorteia uma chave e guarda em `chave_fixa`; a 2ª repete a MESMA chave com o MESMO corpo (como se a rede tivesse caído): `204` com o header `Idempotency-Replayed: true` e o saldo **não** muda.
    children:
      - url: "{{ _.base_url }}/contas/{{ _.conta_origem_id }}/depositos"
        name: "1ª vez: depósito com chave fixa"
        meta:
          id: "req_rkfbank_04_00"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** Um depósito com uma \"senha de pedido\" (`Idempotency-Key`) que fica guardada. É como o número do pedido de uma compra."
          sortKey: 0
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "valor": 10,
              "descricao": "Idempotencia"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
          - name: "Idempotency-Key"
            value: "{{ _.chave_fixa }}"
        authentication:
          type: "bearer"
          token: "{{ _.token_origem }}"
          prefix: ""
        scripts:
          preRequest: "insomnia.environment.set(\"chave_fixa\", \"chave-fixa-\" + Date.now() + \"-\" + Math.random().toString(36).slice(2, 8));"
          afterResponse: "insomnia.test(\"status 204\", () => insomnia.expect(insomnia.response.code).to.equal(204));"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/contas/{{ _.conta_origem_id }}/depositos"
        name: "2ª vez: mesma chave, mesmo corpo → repetição"
        meta:
          id: "req_rkfbank_04_01"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** Manda o MESMO pedido de novo, como se a internet tivesse caído e o app tentasse outra vez. O banco reconhece o número, responde igual e NÃO deposita de novo. Repare no header `Idempotency-Replayed: true`."
          sortKey: 1
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "valor": 10,
              "descricao": "Idempotencia"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
          - name: "Idempotency-Key"
            value: "{{ _.chave_fixa }}"
        authentication:
          type: "bearer"
          token: "{{ _.token_origem }}"
          prefix: ""
        scripts:
          afterResponse: |-
            insomnia.test("status 204", () => insomnia.expect(insomnia.response.code).to.equal(204));
            insomnia.test("Idempotency-Replayed", () => insomnia.expect(insomnia.response.headers.get("Idempotency-Replayed")).to.equal("true"));
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/contas/{{ _.conta_origem_id }}/depositos"
        name: "Mesma chave, outro valor → 422"
        meta:
          id: "req_rkfbank_04_02"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** Mesmo número de pedido, mas outro valor: isso não é repetição, é engano. O banco recusa (`422`) em vez de adivinhar."
          sortKey: 2
        method: "POST"
        body:
          mimeType: "application/json"
          text: |-
            {
              "valor": 99,
              "descricao": "Idempotencia"
            }
        headers:
          - name: "Content-Type"
            value: "application/json"
          - name: "Idempotency-Key"
            value: "{{ _.chave_fixa }}"
        authentication:
          type: "bearer"
          token: "{{ _.token_origem }}"
          prefix: ""
        scripts:
          afterResponse: |-
            insomnia.test("status 422", () => insomnia.expect(insomnia.response.code).to.equal(422));
            insomnia.test("codigo IDEMPOTENCIA_CHAVE_REUSADA", () => insomnia.expect(insomnia.response.json().codigo).to.equal("IDEMPOTENCIA_CHAVE_REUSADA"));
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: "global"
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/contas/{{ _.conta_origem_id }}/depositos"
        name: "Sem a chave → 400"
        meta:
          id: "req_rkfbank_04_03"
          created: 1792955315937
          modified: 1792955315937
          isPrivate: false
          description: "💡 **Em palavras simples:** Movimentar dinheiro sem o número do pedido é recusado (`400`). Assim nenhum app esquece essa proteção."

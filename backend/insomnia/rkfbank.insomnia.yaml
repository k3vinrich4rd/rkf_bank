  - name: "04 · Idempotência (o mesmo pedido não movimenta duas vezes)"
    meta:
      id: "fld_rkfbank_04"
      created: 1792777656439
      modified: 1792777656439
      sortKey: 4
      description: "Mande na ordem. A 1ª sorteia uma chave e guarda em `chave_fixa`; a 2ª repete a MESMA chave com o MESMO corpo (como se a rede tivesse caído): `204` com o header `Idempotency-Replayed: true` e o saldo **não** muda."

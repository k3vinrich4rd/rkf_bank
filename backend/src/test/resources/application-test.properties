# Dados de conexão com o banco H2
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

# H2 Client
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA, SQL
# SQL sai pelo logger org.hibernate.SQL do log4j2-spring.xml (com requestId); show-sql duplicaria no stdout
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT: segredo fixo SO para o perfil de teste (H2 em memoria, nunca producao). Se JWT_SEGREDO existir, ele vale.
rkfbank.jwt.segredo=${JWT_SEGREDO:segredo-apenas-para-testes-locais-com-mais-de-32-bytes}

# Testes partem de banco vazio: sem db/seed (contagens e CPFs dos testes nao colidem).
# DadosEquipeIntegracaoTest e DadosVisitanteIntegracaoTest ligam o seed de proposito, cada um num H2 separado.
spring.flyway.locations=classpath:db/migration
# Nenhum login de equipe vindo do ambiente de quem roda os testes.
rkfbank.equipe.senha=

# @DataJpaTest usa este H2 (com MODE=MySQL) em vez de trocar por um embutido sem modo: o H2 2.5 so aceita DATETIME no modo MySQL.
spring.test.database.replace=none

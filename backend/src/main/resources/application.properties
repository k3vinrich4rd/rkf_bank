spring.application.name=rkfbank

# URL, Usuário e Senha baseados no seu .env
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:5441}/${MYSQL_DATABASE:rkfbank}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:rkfbank}
spring.datasource.password=${MYSQL_PASSWORD:rkfbank}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate 7+
# Quem cria e altera o schema e o Flyway (db/migration); o Hibernate so confere se as entidades batem com o banco.
spring.jpa.hibernate.ddl-auto=validate
# UUID sempre como BINARY(16): e o que o MySQL ja usa, e faz o H2 dos testes validar o mesmo schema do V1
# (sem isso o H2 espera o tipo nativo uuid e o ddl-auto=validate falha).
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
# SQL sai pelo logger org.hibernate.SQL do log4j2-spring.xml (com requestId); show-sql duplicaria no stdout
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Integração ViaCEP
viacep.base-url=https://viacep.com.br/ws
viacep.timeout-ms=3000

# Login (Spring Security + JWT)
# Segredo HS256 so pelo .env (JWT_SEGREDO, minimo 32 bytes). Sem valor padrao de proposito: sem ele a API nao sobe.
rkfbank.jwt.segredo=${JWT_SEGREDO}
# Validade do token (padrao 15 min; sem refresh token, curto limita o estrago de um token vazado).
rkfbank.jwt.expiracao=${JWT_EXPIRACAO:15m}
# Primeiro ADMIN, criado na subida se os dois estiverem no .env. Vazios = nenhum admin.
rkfbank.admin.cpf=${ADMIN_CPF:}
rkfbank.admin.senha=${ADMIN_SENHA:}

# CORS: origens (separadas por virgula) que podem chamar a API direto do navegador. O front local usa o proxy do Next
# e nao depende disto; em deploy com front em outro dominio, informe o dominio dele em CORS_ORIGENS.
rkfbank.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:3000}

# LGPD: cadastro encerrado pelo titular fica guardado por este prazo (Lei 9.613/1998, art. 10) e depois e anonimizado
# pela RotinaAnonimizacao (todo dia as 03:00 de Sao Paulo). Formato de Period: 5y, 60m, 1825d.
rkfbank.lgpd.retencao-apos-encerramento=${LGPD_RETENCAO:5y}

# Flyway: db/migration = schema (todo ambiente); db/seed/equipe = callback afterMigrate que garante, a cada subida,
# as contas da equipe: Felipe (origem) e Renan (destino). Em producao, sem dados de demonstracao:
# FLYWAY_LOCATIONS=classpath:db/migration
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed/equipe}

# Login das contas da equipe (Felipe e Renan), criado na subida pelo CriadorAcessoEquipe. So no .env; vazio = sem login.
rkfbank.equipe.senha=${EQUIPE_SENHA:}

# Le o .env da raiz sozinho (antes era preciso carregar no terminal). "optional:" = sem .env, segue sem erro.
# Variavel de ambiente de verdade continua valendo mais que o .env. Os testes apontam RKFBANK_ENV para um arquivo
# que nao existe (pom.xml), para o .env de quem roda nao mudar o resultado dos testes.
spring.config.import=optional:file:${RKFBANK_ENV:.env}[.properties]

# Health check (Docker, deploy): so GET /actuator/health, publico, devolvendo apenas UP/DOWN.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Console web do H2 DESLIGADO no perfil padrao (MySQL). Precisa ser explicito: o spring-boot-devtools liga
# spring.h2.console.enabled sozinho quando a API roda pela IDE ou pelo spring-boot:run. Os perfis com H2
# (visitante, equipe e test) ligam de volta; a ConfiguracaoConsoleH2 so libera o caminho quando esta ligado.
spring.h2.console.enabled=false

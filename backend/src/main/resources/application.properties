spring.application.name=rkfbank

# URL, Usuário e Senha baseados no seu .env
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:5441}/${MYSQL_DATABASE:rkfbank}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:rkfbank}
spring.datasource.password=${MYSQL_PASSWORD:rkfbank}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate 7+
# Quem cria e altera o schema e o Flyway (db/migration); o Hibernate so confere se as entidades batem com o banco.
spring.jpa.hibernate.ddl-auto=validate
# UUID sempre como BINARY(16): e o que o MySQL ja usa, e faz o H2 dos testes validar o mesmo schema do V1
# (sem isso o H2 espera o tipo nativo uuid e o ddl-auto=validate falha).
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
# SQL sai pelo logger org.hibernate.SQL do log4j2-spring.xml (com requestId); show-sql duplicaria no stdout
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Integração ViaCEP
viacep.base-url=https://viacep.com.br/ws
viacep.timeout-ms=3000

# Login (Spring Security + JWT)
# Segredo HS256 so pelo .env (JWT_SEGREDO, minimo 32 bytes). Sem valor padrao de proposito: sem ele a API nao sobe.
rkfbank.jwt.segredo=${JWT_SEGREDO}
# Validade do token (padrao 15 min; sem refresh token, curto limita o estrago de um token vazado).
rkfbank.jwt.expiracao=${JWT_EXPIRACAO:15m}
# Primeiro ADMIN, criado na subida se os dois estiverem no .env. Vazios = nenhum admin.
rkfbank.admin.cpf=${ADMIN_CPF:}
rkfbank.admin.senha=${ADMIN_SENHA:}

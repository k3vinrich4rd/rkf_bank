spring.application.name=rkfbank

# URL, Usuário e Senha baseados no seu .env
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:5441}/${MYSQL_DATABASE:rkfbank}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:rkfbank}
spring.datasource.password=${MYSQL_PASSWORD:rkfbank}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate 7+
spring.jpa.hibernate.ddl-auto=update
# SQL sai pelo logger org.hibernate.SQL do log4j2-spring.xml (com requestId); show-sql duplicaria no stdout
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Integração ViaCEP
viacep.base-url=https://viacep.com.br/ws
viacep.timeout-ms=3000

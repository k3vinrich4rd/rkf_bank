# Perfil "equipe": Kevin, Renan e Fellipe testando SEM Docker. Banco H2 em memoria (some ao parar a API) com as
# contas da equipe (Fellipe = origem, Renan = destino). Segredos continuam vindo so do .env, como no perfil padrao:
# JWT_SEGREDO (obrigatorio), EQUIPE_SENHA (login do Fellipe e do Renan) e ADMIN_CPF/ADMIN_SENHA (admin).
# Subir: ./mvnw spring-boot:run -Dspring-boot.run.profiles=equipe   (passo a passo no guia privado da equipe)

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:rkfbank-equipe;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2 em http://localhost:8080/h2-console para olhar as tabelas enquanto testa (usuario sa, senha vazia,
# JDBC URL igual a de cima). So nos perfis locais: a ConfiguracaoConsoleH2 libera o caminho so quando isto esta ligado.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.flyway.locations=classpath:db/migration,classpath:db/seed/equipe

# 60 min por padrao no teste manual; JWT_EXPIRACAO do .env continua valendo se existir.
rkfbank.jwt.expiracao=${JWT_EXPIRACAO:60m}

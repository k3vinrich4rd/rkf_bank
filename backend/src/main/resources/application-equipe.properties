# Perfil "equipe": Kevin, Renan e Felipe testando SEM Docker. Banco H2 em memoria (some ao parar a API) com as
# contas da equipe (Felipe = origem, Renan = destino). Segredos continuam vindo so do .env, como no perfil padrao:
# JWT_SEGREDO (obrigatorio), EQUIPE_SENHA (login do Felipe e do Renan) e ADMIN_CPF/ADMIN_SENHA (admin).
# Subir: ./mvnw spring-boot:run -Dspring-boot.run.profiles=equipe   (passo a passo no guia privado da equipe)

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:rkfbank-equipe;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.locations=classpath:db/migration,classpath:db/seed/equipe

# 60 min por padrao no teste manual; JWT_EXPIRACAO do .env continua valendo se existir.
rkfbank.jwt.expiracao=${JWT_EXPIRACAO:60m}

# Perfil "prod": a API publicada na internet. Ligue com SPRING_PROFILES_ACTIVE=prod (o Dockerfile ja liga).
#
# O que este perfil GARANTE, de proposito:
#  - so o schema (db/migration): nenhum dado de teste (sem Fellipe, Renan, Ana ou Bruno);
#  - sem console do H2; Swagger fechado por padrao (SWAGGER_ATIVO=true abre so para leitura, sem "Try it out");
#  - todo segredo vem do ambiente do provedor, nunca do Git: sem valor padrao, a API nao sobe sem eles;
#  - porta do provedor (PORT) e HTTPS atras de proxy (X-Forwarded-*).
#
# Variaveis obrigatorias: DB_HOST, DB_NAME, DB_USER, DB_PASSWORD, JWT_SEGREDO, CORS_ORIGENS.
# Opcionais: DB_PORT (5432), DB_SSL_MODE (require; verify-ca/verify-full se o certificado do banco for instalado),
# ADMIN_CPF/ADMIN_SENHA (primeiro ADMIN), JWT_EXPIRACAO (15m), PORT (8080), SWAGGER_ATIVO (false). Lista completa: backend/README_DEPLOY.md.

# SSL obrigatorio por padrao (sslmode do driver PostgreSQL: disable, allow, prefer, require, verify-ca, verify-full).
# Por que require e nao prefer: o banco gerenciado (Aiven) fica fora da rede do Render, na internet publica. Com
# prefer/allow o driver aceita cair para conexao SEM criptografia se o SSL falhar, e senha e dados do banco passariam em
# texto puro. require recusa conectar sem SSL. Nao confere o certificado (isso e verify-ca/verify-full, que pedem o CA do
# Aiven num arquivo, sslrootcert); fica como evolucao documentada no backend/README_DEPLOY.md.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:require}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Plano gratuito/barato = poucas conexoes no banco: 5 bastam para o MVP e nao estouram o limite do provedor.
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}

# Datas sempre em UTC no banco, qualquer que seja o fuso da JVM (o Dockerfile usa TZ=America/Sao_Paulo e o provedor
# pode usar outro). Sem isto, o Hibernate grava os Instant no fuso da JVM: trocar de provedor ou de TZ deslocaria
# o extrato, o limite de tentativas de login e a validade dos tokens de renovacao em horas. As colunas sao timestamptz (guardam o
# instante absoluto), o que ja protege o dado; esta propriedade mantem o Hibernate falando UTC com o driver.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.locations=classpath:db/migration

# Swagger fechado por padrao. A demo publica liga com SWAGGER_ATIVO=true para quem avalia ler o contrato no
# navegador, mas sem o botao "Try it out" (lista vazia): a tela so documenta; para chamar a API, use o site.
springdoc.api-docs.enabled=${SWAGGER_ATIVO:false}
springdoc.swagger-ui.enabled=${SWAGGER_ATIVO:false}
springdoc.swagger-ui.supported-submit-methods=
spring.h2.console.enabled=false

# Sem padrao: em producao o dominio do site tem que ser dito (o front usa o proxy do Next, mas um navegador
# chamando a API direto so passa se a origem estiver aqui).
rkfbank.cors.origens-permitidas=${CORS_ORIGENS}

# Producao nao tem contas da equipe: o login delas nunca e criado, mesmo que EQUIPE_SENHA exista no ambiente.
rkfbank.equipe.senha=

server.port=${PORT:8080}
# O provedor termina o HTTPS e repassa em HTTP com X-Forwarded-Proto/Host: assim as URLs que a API monta saem com
# https e o dominio publico, nao com o endereco interno do container.
server.forward-headers-strategy=framework
server.shutdown=graceful

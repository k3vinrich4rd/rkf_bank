# Perfil "visitante": para quem chega pelo GitHub testar a API inteira na propria maquina, sem Docker e sem .env.
# Subir: ./mvnw spring-boot:run -Dspring-boot.run.profiles=visitante   (guia: VISITANTES.md na raiz)
#
# O que este perfil GARANTE, de proposito:
#  - banco H2 em memoria: some ao parar a API, nada fica gravado;
#  - so as contas de visitante (Ana e Bruno, senha publica Visitante@2026); nenhuma conta da equipe, nenhum admin;
#  - segredo do JWT sorteado a cada subida (ninguem conhece, nem quem le este arquivo), entao ninguem forja token;
#  - ignora o .env de quem roda: JWT_SEGREDO, ADMIN_* e EQUIPE_SENHA nao valem aqui.

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:rkfbank-visitante;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.locations=classpath:db/migration,classpath:db/seed/visitante

rkfbank.jwt.segredo=
rkfbank.jwt.segredo-aleatorio=true
# 60 min: sobra tempo para seguir o guia sem refazer o login a cada passo.
rkfbank.jwt.expiracao=60m

rkfbank.admin.cpf=
rkfbank.admin.senha=
rkfbank.equipe.senha=

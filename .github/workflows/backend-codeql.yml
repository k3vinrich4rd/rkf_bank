name: Backend CodeQL

# Análise de segurança do código Java (SQL injection, dados sensíveis em log,
# validação de entrada etc.). Os alertas aparecem em Security > Code scanning.

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/src/main/**"
      - "pom.xml"
      - ".github/workflows/backend-codeql.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/src/main/**"
      - "pom.xml"
      - ".github/workflows/backend-codeql.yml"
  schedule:
    # Toda segunda às 06:17 UTC: pega vulnerabilidades novas mesmo sem commits.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analisar:
    name: Analisar código Java
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      # build-mode none: o CodeQL lê o código-fonte sem compilar,
      # então não depende da versão do JDK nem do banco.
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - name: Rodar a análise
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

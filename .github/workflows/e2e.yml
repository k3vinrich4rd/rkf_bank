name: E2E (aplicação inteira)

# O RKF Bank inteiro rodando junto, como um visitante usaria: a API (perfil visitante, H2 com Ana e Bruno) e o
# site (Next, build de produção) conversando pelo proxy. Prova o que o CI de cada lado sozinho não prova:
#   1. a coleção pública do Insomnia (83 requisições) contra a API de verdade;
#   2. o smoke do cadastro ao extrato (42 verificações);
#   3. o site abrindo as páginas, fazendo login e trazendo a conta pela API (scripts/e2e-site.mjs).

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/src/main/**"
      - "pom.xml"
      - "frontend/**"
      - "scripts/rodar-colecao-insomnia.mjs"
      - "scripts/smoke-e2e.mjs"
      - "scripts/e2e-site.mjs"
      - "backend/insomnia/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-e-api:
    name: Site + API + coleção do Insomnia
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Empacotar a API (os testes rodam no Backend CI)
        run: sh mvnw -B -ntp package -DskipTests -Djacoco.skip=true

      - name: Subir a API (perfil visitante)
        run: |
          nohup java -jar target/rkfbank-*.jar --spring.profiles.active=visitante > api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:8080/actuator/health && exit 0; sleep 3; done
          echo "a API não ficou UP em 3 minutos"; exit 1

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Configurar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Coleção do Insomnia (83 requisições)
        run: node scripts/rodar-colecao-insomnia.mjs

      - name: Smoke do cadastro ao extrato
        run: node scripts/smoke-e2e.mjs http://localhost:8080

      - name: Construir e subir o site (build de produção)
        working-directory: frontend
        env:
          API_URL: http://localhost:8080
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm start -p 3000 > ../site.log 2>&1 &
          for i in $(seq 1 40); do curl -fs -o /dev/null http://localhost:3000/ && exit 0; sleep 3; done
          echo "o site não respondeu em 2 minutos"; exit 1

      - name: Site e API de ponta a ponta
        run: node scripts/e2e-site.mjs http://localhost:3000

      - name: Logs (se falhou)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-e2e
          path: |
            api.log
            site.log
          retention-days: 7

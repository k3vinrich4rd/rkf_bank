# Dependabot abre PRs para a develop quando sai versão nova de uma dependência.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Dependências do backend (pom.xml na raiz)
  - package-ecosystem: maven
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework*"
      plugins-maven:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.jacoco:*"

  # Versões das actions usadas nos workflows (.github/workflows)
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Dependências do frontend (frontend/package.json + pnpm-lock.yaml)
  - package-ecosystem: npm
    directory: "/frontend"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    groups:
      next-e-react:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react*"
      testes:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
          - "@vitejs/*"

services:
  database:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: rkfbank-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-5441}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-senha-root-do-banco}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rkfbank}
      MYSQL_USER: ${MYSQL_USER:-usuario-do-banco}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-senha-do-banco}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-usuario-do-banco}", "-p${MYSQL_PASSWORD:-senha-do-banco}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
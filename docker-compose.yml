services:
  database:
    image: postgres:${POSTGRES_VERSION:-17}
    container_name: rkfbank-postgres
    restart: unless-stopped
    ports:
      # 5441 no seu computador (fora da 5432 padrao, para nao colidir com um PostgreSQL instalado); 5432 dentro do container.
      - "${POSTGRES_PORT:-5441}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rkfbank}
      POSTGRES_USER: ${POSTGRES_USER:-usuario-do-banco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha-do-banco}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usuario-do-banco} -d ${POSTGRES_DB:-rkfbank}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
